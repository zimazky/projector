name: Build and Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 24.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'

      - name: Use npm 11.12.1
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Check lint
        run: npm run lint-check

      - name: Test
        run: npm test -- --runInBand

      - name: Check browser test types
        run: npm run typecheck:e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test in Chromium
        run: npm run test:e2e

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/playwright/report
            artifacts/playwright/results
            artifacts/playwright/results.json
          retention-days: 7

      - name: Build
        run: npm run build:pages
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          OPEN_WEATHER_KEY: ${{ secrets.OPEN_WEATHER_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

